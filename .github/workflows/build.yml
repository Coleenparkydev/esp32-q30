name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 0.35.3
          echo "$PWD/bin" >> $GITHUB_PATH
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
      - name: Install audio libraries (pinned)
        run: |
          LIB=~/Arduino/libraries
          mkdir -p "$LIB"
          git clone --depth 1 --branch v1.2.5 https://github.com/pschatzmann/arduino-audio-tools "$LIB/arduino-audio-tools"
          git clone https://github.com/pschatzmann/ESP32-A2DP       "$LIB/ESP32-A2DP"
          git -C "$LIB/ESP32-A2DP"  checkout a39ecc16f9f5994a7c48206a6613ed397f80a967
          git clone https://github.com/pschatzmann/arduino-libhelix "$LIB/arduino-libhelix"
          git -C "$LIB/arduino-libhelix" checkout 7d0444cac095e2695d63c40ba62b3c40a39ae592
      - name: Show versions
        run: |
          arduino-cli core list
          echo "--- ESP32-A2DP:"      && git -C ~/Arduino/libraries/ESP32-A2DP       log -1 --oneline
          echo "--- arduino-libhelix:" && git -C ~/Arduino/libraries/arduino-libhelix log -1 --oneline
      - name: Install OLED libraries
        run: |
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library" "Adafruit BusIO"
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,CPUFreq=240,FlashMode=qio" \
            --output-dir ./build \
            ./esp32-q30-player
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/esp32-q30-player.ino.bin
            build/esp32-q30-player.ino.bootloader.bin
            build/esp32-q30-player.ino.partitions.bin
